
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>FINN HTML Test</title>
</head>
<body>

<h2>FINN HTML</h2>
<div id="result">Yükleniyor...</div>

<script>
function receiveFinn(data) {
  const html = data.html;

  const doc = new DOMParser()
    .parseFromString(html, 'text/html');

  document.getElementById('result').textContent =
    'HTML alındı: ' + html.length +
    ' karakter | Başlık: ' + doc.title;

  console.log('FINN HTML:', html);
}

const script = document.createElement('script');

script.src =
  'https://script.google.com/macros/s/' +
  'AKfycbxorZi_QP5Rh8a6NCvdPYY2r6OmsBVyVRjUvE4j3BAox2FE9Jdwj37U4AMWl7S-5cLiSA' +
  '/exec?callback=receiveFinn';

script.onerror = () => {
  document.getElementById('result').textContent =
    'Apps Script yüklenemedi.';
};

document.head.appendChild(script);
</script>

</body>
</html>
