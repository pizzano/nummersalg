<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Fetch API</h1>
<h2>Fetching a Text File</h2>

<p id="demo"></p>

<script>
let file = "https://script.google.com/macros/s/AKfycbxorZi_QP5Rh8a6NCvdPYY2r6OmsBVyVRjUvE4j3BAox2FE9Jdwj37U4AMWl7S-5cLiSA/exec";

// Fetch a file
fetch(file)
  .then(function(response) {
    return response.text();
  })
  .then(function(data) {
    myDisplayer(data);
  });

// Function to display any text
function myDisplayer(text) {
  document.getElementById("demo").innerText = text;
}
</script>

</body>
</html>
